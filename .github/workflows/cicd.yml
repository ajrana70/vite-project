name: Build and deploy in dev EKS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Webhook - Checkout Started
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "event": "step_started",
            "step": "Checkout Code",
            "status": "running",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}"
          }' https://4bbe-27-123-251-106.ngrok-free.app/v1/webhooks/github

      - name: Checkout
        uses: actions/checkout@v2

      - name: Notify Webhook - AWS Credentials Setup Started
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "event": "step_started",
            "step": "Configure AWS Credentials",
            "status": "running",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}"
          }' https://4bbe-27-123-251-106.ngrok-free.app/v1/webhooks/github

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::130705418859:role/dev-devseccops-github-role
          aws-region: ap-south-1

      - name: Notify Webhook - Create ECR Repository Started
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "event": "step_started",
            "step": "Create ECR Repository",
            "status": "running",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}"
          }' https://4bbe-27-123-251-106.ngrok-free.app/v1/webhooks/github

      - name: Create ECR repository
        id: ECR
        run: |
          aws ecr describe-repositories --region ap-south-1 --repository-names ${{ github.event.repository.name }} || aws ecr create-repository --region ap-south-1 --repository-name ${{ github.event.repository.name }}

      - name: Notify Webhook - Login to ECR Started
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "event": "step_started",
            "step": "Login to Amazon ECR",
            "status": "running",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}"
          }' https://4bbe-27-123-251-106.ngrok-free.app/v1/webhooks/github

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Notify Webhook - Build and Push Image Started
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "event": "step_started",
            "step": "Build and Push Docker Image",
            "status": "running",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}"
          }' https://4bbe-27-123-251-106.ngrok-free.app/v1/webhooks/github

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Notify Webhook - Deploy to Dev EKS Started
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "event": "step_started",
            "step": "Deploy to Dev EKS Cluster",
            "status": "running",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}"
          }' https://4bbe-27-123-251-106.ngrok-free.app/v1/webhooks/github

      - name: Adding service configs repo
        uses: actions/checkout@v2
        with:
          repository: "devseccops/devseccops-service-configs"
          token: "${{ secrets.GH_TOKEN }}"
          path: devseccops-service-configs
          ref: "dev"

      - name: Deploy to Dev EKS Cluster
        run: |
          cd devseccops-service-configs
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
          IMAGE=${{ github.ref_name }} yq -i '.image.tag=strenv(IMAGE)' ${{ github.event.repository.name }}/values.yaml
          cat ${{ github.event.repository.name }}/values.yaml

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Updating values.yaml with image tag: ${{ github.ref_name }}"
          branch: dev
          repository: ./devseccops-service-configs
