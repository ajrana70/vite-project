name: Simple CI for Vite

on:
  workflow_dispatch: # Added for manual triggering
  push:
    branches:
      - main  # or whichever branch you prefer

jobs:
  print-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Print a custom log
        run: echo "🚀 Hello from CI! This is a Vite project."

      - name: Optional - Build the project
        run: npm run build
