name: Build and Push to prod1 GCR

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    # runs-on: [self-hosted, deveks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker to use Google Cloud
        run: gcloud auth configure-docker gcr.io

      - name: Set Environment variables
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          if [[ -z "$PROJECT_ID" || -z "$REPO_NAME" ]]; then
            echo "Error: PROJECT_ID or REPO_NAME is empty!" >&2
            exit 1
          fi

          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "IMAGE_TAG=$/{{ github.sha }}" >> $GITHUB_ENV
          echo "GCR_REGISTRY=gcr.io/$PROJECT_ID" >> $GITHUB_ENV
          echo "GCR_REPOSITORY=$REPO_NAME" >> $GITHUB_ENV

      - name: Ensure GCR Repository Exists
        run: |
          if ! gcloud artifacts repositories describe $REPO_NAME --location=us-central1 >/dev/null 2>&1; then
            echo "Creating GCR repository: $REPO_NAME"
            gcloud artifacts repositories create $REPO_NAME               --repository-format=docker               --location=us-central1               --description="GCR Repository for $REPO_NAME"
          else
            echo "GCR repository $REPO_NAME already exists."
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build and Push Docker Image to GCR
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          IMAGE_NAME=gcr.io/$PROJECT_ID/${{ github.event.repository.name }}:latest
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Verify Image in GCR
        run: |
          echo "Checking if image exists in GCR..."
          gcloud container images list-tags $GCR_REGISTRY/$GCR_REPOSITORY --format="table(digest, tags, timestamp.datetime)"


 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set Environment Variables
        id: prep
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          AKS_CLUSTER: prod1-ajrana70-aks-cluster
        run: |
          echo "GCR_REGISTRY=${{ steps.login-gke.outputs.registry }}" >> $GITHUB_OUTPUT
          echo "GCR_REPOSITORY=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "IMAGE_VERSION=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "CLUSTER=${{ env.AKS_CLUSTER }}" >> $GITHUB_OUTPUT
          echo "GIT_TOKEN=${{ env.GIT_TOKEN }}" >> $GITHUB_OUTPUT

      - name: Debug Variables
        run: |
           echo "GCR_REGISTRY=$GCR_REGISTRY"
           echo "GCR_REPOSITORY=$GCR_REPOSITORY"
           echo "IMAGE_TAG=$IMAGE_TAG"
           echo "IMAGE_VERSION=$IMAGE_VERSION"
           echo "CLUSTER=$CLUSTER"
           echo "GIT_TOKEN=******"  # Masked for security
         
      - name: Adding service config repo
        uses: actions/checkout@v2
        with: 
          repository: ajrana70/devseccops-service-configs
          token: '${{ secrets.GIT_TOKEN }}'
          path:  devseccops-service-configs
          ref: main

      - name: Deploy to prod1 EKS cluster
        env:
          GCR_REGISTRY: ${{ steps.prep.outputs.GCR_REGISTRY }}
          GCR_REPOSITORY: ${{ steps.prep.outputs.GCR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.prep.outputs.IMAGE_TAG }}
          IMAGE_VERSION: ${{ steps.prep.outputs.IMAGE_VERSION }}
          CLUSTER: ${{ steps.prep.outputs.CLUSTER }}
          GIT_TOKEN: ${{ steps.prep.outputs.GIT_TOKEN }}
        run: |
          cd  devseccops-service-configs
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
          yq --version
           # Debug: Print all environment variables
          echo "GCR_REGISTRY: $GCR_REGISTRY"
          echo "GCR_REPOSITORY: $GCR_REPOSITORY"
          echo "IMAGE_TAG: $IMAGE_TAG"
          echo "IMAGE_VERSION: $IMAGE_VERSION"
          echo "CLUSTER: $CLUSTER"
          echo "GIT_TOKEN: **** (masked for security)"
          IMAGE=$IMAGE_TAG-$IMAGE_VERSION yq -i '.image.tag=strenv(IMAGE)' ${{ steps.prep.outputs.GCR_REPOSITORY }}/values.yaml
          cat ${{ steps.prep.outputs.GCR_REPOSITORY }}/values.yaml
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Updating ajrana70 values.yaml with image tag: ${{ steps.prep.outputs.IMAGE_TAG }}-${{ steps.prep.outputs.IMAGE_VERSION }}"
          create_branch: true
          branch: main
          repository: ./devseccops-service-configs
   