name: Azure CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set Environment Variables
        id: prep
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=${{ github.event.repository.name }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "IMAGE_VERSION=${{ github.run_number }}" >> $GITHUB_ENV
          echo "CLUSTER=dev-ajrana70-eks-cluster" >> $GITHUB_ENV
          echo "GIT_TOKEN=${{ secrets.GH_TOKEN }}" >> $GITHUB_ENV

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          echo "Building and pushing image..."
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # Verify ACR Exists
      - name: Verify ACR Registry
        run: |
          az acr show --name ${{ secrets.ACR_NAME }} --output table || echo "ACR does not exist!"

      # Check ACR Health (optional)
      - name: Check ACR Health
        run: az acr check-health -n ${{ secrets.ACR_NAME }} --yes

      # Check if ACR Repository Exists
      - name: Check if ACR Repository Exists
        id: check-acr
        run: |
          EXISTS=$(az acr repository list --name ${{ secrets.ACR_NAME }} --query "contains(@, '${{ env.ECR_REPOSITORY }}')" -o tsv)
          echo "Repository exists: $EXISTS"
          echo "REPO_EXISTS=$EXISTS" >> $GITHUB_ENV

      - name: Create ACR Repository if Not Exists
        if: env.REPO_EXISTS == 'false'
        run: |
          echo "Repository does not exist. Creating..."
          az acr repository create --name ${{ secrets.ACR_NAME }} --repository ${{ env.ECR_REPOSITORY }} || echo "Repository creation skipped (not supported by ACR CLI)"

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.ECR_REPOSITORY }}:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Set AKS Context
        run: |
          az aks get-credentials --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get services
