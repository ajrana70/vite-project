name: Azure CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
          
      - name: Set variables
        run: |
          echo "ACR_NAME=myacrname" >> $GITHUB_ENV   # Replace with your ACR name
          echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV  # Use GitHub repo name

      - name: Check if ACR repository exists
        id: check-acr
        run: |
          EXISTS=$(az acr repository list --name $ACR_NAME --query "contains(@, '$REPO_NAME')")
          echo "Repository exists: $EXISTS"
          echo "REPO_EXISTS=$EXISTS" >> $GITHUB_ENV

      - name: Create ACR Repository (if not exists)
        if: env.REPO_EXISTS == 'false'
        run: |
          echo "Repository does not exist. Creating..."
          az acr repository create --name $ACR_NAME --repository $REPO_NAME

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/myapp:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/myapp:latest

      - name: Set AKS Context
        run: |
          az aks get-credentials --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get services
