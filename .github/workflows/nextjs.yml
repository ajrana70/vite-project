name: Azure CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create ACR (if not exists)
        run: |
          az acr show --name ${{ secrets.ACR_NAME }} --query "id" --output tsv 2>/dev/null || \
          az acr create --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.ACR_NAME }} --sku Basic

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

            - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Environment Variables
        id: prep
        env:
          AKS_CLUSTER: dev-ajrana70-aks-cluster
          GIT_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "ACR_REGISTRY=${{ steps.login-acr.outputs.registry }}" >> $GITHUB_ENV
          echo "ACR_REPOSITORY=${{ github.event.repository.name }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "IMAGE_VERSION=${{ github.run_number }}" >> $GITHUB_ENV
          echo "CLUSTER=${{ env.AKS_CLUSTER }}" >> $GITHUB_ENV
          echo "GIT_TOKEN=${{ env.GIT_TOKEN }}" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v6
        id: build-image
        env: 
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_REPOSITORY: ${{ env.ACR_REPOSITORY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          CLUSTER: ${{ env.CLUSTER }}
          IMAGE_VERSION: ${{ env.IMAGE_VERSION }}
        with:
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:latest, ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Set AKS Context
        run: |
          az aks get-credentials --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get services