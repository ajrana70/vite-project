name: Azure CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2


      - name: Set Environment variables
        id: prep
        env:
           EKS_CLUSTER: dev-ajrana70-eks-cluster
           GIT_TOKEN: \${{ secrets.GH_TOKEN }}
         run: |
           echo ::set-output name=ECR_REGISTRY::\${{ steps.login-ecr.outputs.registry }}
           echo ::set-output name=ECR_REPOSITORY::\${{ github.event.repository.name }}
           echo ::set-output name=IMAGE_TAG::\${{ github.ref_name }}
           echo ::set-output name=IMAGE_VERSION::\${{ github.run_number }}
           echo ::set-output name=CLUSTER::\${{ env.EKS_CLUSTER }}
           echo ::set-output name=GIT_TOKEN::\${{ env.GIT_TOKEN }}


       - name: Build, tag, and push image to Amazon ECR
         id: build-image
         env:
           ECR_REGISTRY: \${{ steps.prep.outputs.ECR_REGISTRY }}
           ECR_REPOSITORY: \${{ steps.prep.outputs.ECR_REPOSITORY }}
           IMAGE_TAG: \${{ steps.prep.outputs.IMAGE_TAG }}
           CLUSTER: \${{ steps.prep.outputs.CLUSTER }}
           IMAGE_VERSION: \${{ steps.prep.outputs.IMAGE_VERSION }}

      # Verify ACR Exists
      - name: Verify ACR Registry
        run: |
          az acr show --name $ACR_NAME --output table || echo "ACR does not exist!"

      # Check ACR Health (optional)
      - name: Check ACR Health
        run: az acr check-health -n $ACR_NAME --yes

      # Check if ACR Repository Exists
      - name: Check if ACR Repository Exists
        id: check-acr
        run: |
          EXISTS=$(az acr repository list --name $ACR_NAME --query "contains(@, '$REPO_NAME')" -o tsv)
          echo "Repository exists: $EXISTS"
          echo "REPO_EXISTS=$EXISTS" >> $GITHUB_ENV

      - name: Create ACR Repository if Not Exists
        if: env.REPO_EXISTS == 'false'
        run: |
          echo "Repository does not exist. Creating..."
          az acr repository create --name $ACR_NAME --repository $REPO_NAME || echo "Repository creation skipped (not supported by ACR CLI)"

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_NAME }}:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_NAME }}:latest

      - name: Set AKS Context
        run: |
          az aks get-credentials --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get services
