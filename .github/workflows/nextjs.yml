name: Azure CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create ACR (if not exists)
        run: |
          az acr show --name ${{ secrets.ACR_NAME }} --query "id" --output tsv 2>/dev/null || \
          az acr create --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.ACR_NAME }} --sku Basic

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Environment variables
        id: prep
        env:
           AKS_CLUSTER: dev-ajrana70-aks-cluster
           GIT_TOKEN: \${{ secrets.GH_TOKEN }}
         run: |
           echo ::set-output name=ACR_REGISTRY::\${{ steps.login-acr.outputs.registry }}
           echo ::set-output name=ACR_REPOSITORY::\${{ github.event.repository.name }}
           echo ::set-output name=IMAGE_TAG::\${{ github.ref_name }}
           echo ::set-output name=IMAGE_VERSION::\${{ github.run_number }}
           echo ::set-output name=CLUSTER::\${{ env.AKS_CLUSTER }}
           echo ::set-output name=GIT_TOKEN::\${{ env.GIT_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        id: build-image
        env: 
          ACR_REGISTRY: \${{ steps.prep.outputs.registry }}
          ACR_REPOSITORY: \${{ steps.prep.outputs.ACR_REPOSITORY }}
          IMAGE_TAG: \${{ steps.prep.outputs.IMAGE_TAG }}
          CLUSTER: \${{ steps.prep.outputs.CLUSTER }}
          IMAGE_VERSION: \${{ steps.prep.outputs.IMAGE_VERSION }}
        with:
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:latest, ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ env.GIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set AKS Context
        run: |
          az aks get-credentials --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get services