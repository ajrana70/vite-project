name: Deploy to Amazon ECR

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Amazon ECR
        uses: aws-actions/login@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "ap-south-1" # Replace with your AWS region

      - name: Build and push Docker image
        run: |

          # Get the account ID for the current AWS account
          ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)

          # Get the ECR repository URL
          REPO_URL=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

          # Login to Amazon ECR
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REPO_URL}

          # Build the Docker image
          docker build -t ${REPO_URL}/vite-project .

          # Push the Docker image to ECR
          docker push ${REPO_URL}/vite-project

      - name: Verify deployment
        run: |
          echo "Docker image pushed to Amazon ECR"

# To set the environment variables for the AWS region, add this to your workflow
env:
  AWS_REGION: "ap-south-1" # Replace with your AWS region
