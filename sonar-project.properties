sonar.projectKey=my-vite-project
sonar.projectName=My Vite App
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.*,**/*.spec.*

# Fix Vite output folder
sonar.exclusions=**/node_modules/**,**/dist/**

# Coverage (if using vitest or jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Replace with your SonarQube instance
sonar.host.url=https://k8s-manpreet-sonarqub-d7b95aae0f-2067696507.ap-south-1.elb.amazonaws.com
